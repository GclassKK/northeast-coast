<title>東北角天氣潮汐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a1929;
    --bg2: #0f2942;
    --card: #14304d;
    --card2: #1a3a5c;
    --line: #23496f;
    --text: #eaf2fb;
    --sub: #9fbcd8;
    --accent: #4db8ff;
    --warm: #ffb84d;
    --hot: #ff7a59;
    --cool: #7ee0c8;
    --spring: #ff8a4d;   /* 大潮 */
    --neap: #6fa8dc;     /* 小潮 */
  }
  html, body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    line-height: 1.5;
    background: #0a1929;
  }
  body {
    max-width: 1040px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px);
    position: relative;
    z-index: 1;
  }
  /* 儀表板網格：一頁全覽 */
  #content {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px;
    align-items: stretch;
  }
  #content .card {
    margin-top: 0;
    display: flex; flex-direction: column;
  }
  /* 卡片主體撐開，讓等高卡片內容分布均勻 */
  #content .card > .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  #content .span2 { grid-column: span 2; }
  @media (max-width: 660px) {
    #content { grid-template-columns: 1fr; }
    #content .span2 { grid-column: span 1; }
  }

  #seascape svg { display: none; }
  /* 覆蓋一層暗色讓內容易讀 */
  #seascape::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,25,41,.35) 0%, rgba(10,25,41,.15) 40%, rgba(10,25,41,.55) 100%);
  }

  header {
    padding: 16px 2px 10px;
    position: sticky; top: 0;
    background: linear-gradient(180deg, rgba(10,25,41,.85) 55%, rgba(10,25,41,0.0) 100%);
    z-index: 20;
    backdrop-filter: blur(6px);
  }
  .title { font-size: 19px; font-weight: 700; letter-spacing: .5px; display:flex; align-items:center; gap:8px; }
  .title .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .updated { font-size: 11px; color: var(--sub); margin-top: 3px; }

  /* 地點切換 */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 4px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 8px 15px; border-radius: 20px;
    background: var(--card); color: var(--sub); font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); cursor: pointer; white-space: nowrap;
    transition: all .18s;
  }
  .tab.active { background: var(--accent); color: #04223a; border-color: var(--accent); }

  .card {
    background: rgba(20,48,77,.72); border: 1px solid rgba(75,150,220,.28); border-radius: 16px;
    padding: 14px; margin-top: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .card h2 { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; display:flex; align-items:center; gap:7px; }
  .card h2 .ic { font-size: 15px; }

  /* 現況大卡 */
  .now { display: flex; align-items: center; justify-content: space-between; }
  .now .temp { font-size: 54px; font-weight: 300; line-height: 1; }
  .now .temp small { font-size: 22px; color: var(--sub); }
  .now .desc { text-align: right; }
  .now .desc .emoji { font-size: 44px; }
  .now .desc .txt { font-size: 14px; color: var(--sub); margin-top: 2px; }
  .now-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 16px; }
  .metric { background: var(--bg2); border-radius: 12px; padding: 10px; text-align: center; }
  .metric .k { font-size: 11px; color: var(--sub); }
  .metric .v { font-size: 17px; font-weight: 600; margin-top: 3px; }
  .metric .v small { font-size: 11px; color: var(--sub); font-weight: 400; }

  /* 農曆卡 */
  .lunar-row { display: flex; align-items: center; gap: 14px; }
  .moon-face { font-size: 46px; line-height: 1; }
  .lunar-info { flex: 1; }
  .lunar-info .ld { font-size: 20px; font-weight: 600; }
  .lunar-info .lp { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .tide-badge {
    display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
    margin-top: 6px;
  }
  .tide-badge.spring { background: rgba(255,138,77,.18); color: var(--spring); border:1px solid rgba(255,138,77,.4); }
  .tide-badge.neap   { background: rgba(111,168,220,.18); color: var(--neap); border:1px solid rgba(111,168,220,.4); }
  .tide-badge.mid    { background: rgba(159,188,216,.15); color: var(--sub); border:1px solid var(--line); }

  /* 潮汐 */
  .tide-chart { background: var(--bg2); border-radius: 12px; padding: 14px 10px 8px; margin-bottom: 12px; }
  .tide-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px,1fr)); gap: 8px; }
  .tide-item { background: var(--bg2); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .tide-item .type { font-size: 12px; font-weight: 700; }
  .tide-item .type.high { color: var(--accent); }
  .tide-item .type.low  { color: var(--warm); }
  .tide-item .tm { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .tide-item .ht { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .note { font-size: 11px; color: var(--sub); margin-top: 10px; line-height:1.4; }

  /* 日出日落 */
  .sun-chart { background: var(--bg2); border-radius: 12px; padding: 12px 6px 6px; }
  .sun-row { display: flex; justify-content: space-around; text-align: center; }
  .sun-row .k { font-size: 12px; color: var(--sub); }
  .sun-row .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .sun-row .ic { font-size: 22px; }

  /* 未來預報（Yahoo 天氣風格）*/
  .fc-row {
    display: flex; align-items: center; gap: 8px; padding: 12px 2px;
    border-bottom: 1px solid var(--line);
  }
  .fc-row:last-child { border-bottom: none; }
  .fc-day { width: 42px; font-size: 14px; flex: 0 0 auto; }
  .fc-day .wd { font-weight: 600; }
  .fc-day .dt { font-size: 10px; color: var(--sub); }
  .fc-emoji { font-size: 24px; width: 30px; text-align: center; flex: 0 0 auto; }
  .fc-moon { font-size: 15px; width: 20px; text-align:center; flex: 0 0 auto; opacity:.9; }
  .fc-rain {
    width: 46px; font-size: 12px; color: var(--accent); flex: 0 0 auto;
    display: flex; align-items: center; gap: 2px; justify-content: flex-end;
  }
  .fc-rain.dry { color: var(--sub); opacity: .45; }
  /* 溫度範圍橫條 */

const LUNAR_INFO = [

  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
  0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
  0x0d520
];
const LUNAR_MONTH = ['正','二','三','四','五','六','七','八','九','十','冬','臘'];
const LUNAR_DAY = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

function lYearDays(y){ let s=348; for(let i=0x8000;i>0x8;i>>=1) s+=(LUNAR_INFO[y-1900]&i)?1:0; return s+leapDays(y); }
function leapMonth(y){ return LUNAR_INFO[y-1900]&0xf; }
function leapDays(y){ if(leapMonth(y)) return (LUNAR_INFO[y-1900]&0x10000)?30:29; return 0; }
function monthDays(y,m){ return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29; }

function solarToLunar(date){
  const baseDate = Date.UTC(1900,0,31);
  const objDate = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  let offset = Math.floor((objDate - baseDate)/86400000);
  let y=1900, temp=0;
  for(; y<2101 && offset>0; y++){ temp=lYearDays(y); offset-=temp; }
  if(offset<0){ offset+=temp; y--; }
  const leap = leapMonth(y);
  let isLeap=false, m=1;
  for(; m<13 && offset>0; m++){
    if(leap>0 && m===leap+1 && !isLeap){ m--; isLeap=true; temp=leapDays(y); }
    else { temp=monthDays(y,m); }
    if(isLeap && m===leap+1) isLeap=false;
    offset-=temp;
  }
  if(offset===0 && leap>0 && m===leap+1){ if(isLeap) isLeap=false; else { isLeap=true; m--; } }
  if(offset<0){ offset+=temp; m--; }
  const day = offset+1;
  return { year:y, month:m, day:day, isLeap:isLeap,
           monthName:(isLeap?'閏':'')+LUNAR_MONTH[m-1], dayName:LUNAR_DAY[day-1] };
}

/* 月相：用農曆日估算（初一新月、十五滿月）＋潮型 */
function moonPhase(lunarDay){
  // 回傳 emoji + 名稱 + 潮型
  let emoji, name, tide, tideClass;
  const d = lunarDay;
  if(d===1)      { emoji='🌑'; name='朔（新月）'; }
  else if(d<=6)  { emoji='🌒'; name='眉月'; }
  else if(d<=9)  { emoji='🌓'; name='上弦月'; }
  else if(d<=13) { emoji='🌔'; name='盈凸月'; }
  else if(d<=17) { emoji='🌕'; name='望（滿月）'; }
  else if(d<=21) { emoji='🌖'; name='虧凸月'; }
  else if(d<=24) { emoji='🌗'; name='下弦月'; }
  else           { emoji='🌘'; name='殘月'; }

  // 大潮：初一、十五前後（朔望）；小潮：初八、廿三前後（上下弦）
  const distNew  = Math.min(d-1, 30-d);           // 離朔的天數
  const distFull = Math.abs(d-15);                // 離望的天數
  const springDist = Math.min(distNew, distFull); // 離大潮
  if(springDist<=2){ tide='大潮'; tideClass='spring'; }
  else if(Math.abs(d-8)<=1 || Math.abs(d-23)<=1){ tide='小潮'; tideClass='neap'; }
  else { tide='中潮'; tideClass='mid'; }
  return { emoji, name, tide, tideClass };
}

/* ============================================================
   潮汐估算（天文半日潮模型）
   東北角為半日潮，一天約兩次滿潮兩次乾潮。
   以月球中天時間推估；大小潮由月相調整潮差。
   註明為估算值。
   ============================================================ */
const TIDE_PERIOD = 12.42; // 半日潮週期(小時)

function tideParams(lunarDay){
  // 月球每天約晚 50 分鐘。朔日(初一)月上中天約正午，每日順延約 0.84 小時。
  const lunarHour = ((lunarDay-1) * 0.84 + 12) % 24;
  const lag = 0.8;                       // 東北角高潮間隙約 +0.8hr
  const tHigh1 = (lunarHour + lag) % 24; // 當日第一個滿潮基準時刻

  // 潮差：大潮大、小潮小（東北角潮差約 0.5~1.4m）
  const distNew  = Math.min(lunarDay-1, 30-lunarDay);
  const distFull = Math.abs(lunarDay-15);
  const springDist = Math.min(distNew, distFull);
  const range = 1.4 - springDist*0.11;
  return { tHigh1, amp: range/2, mean: 0.9 };
}

// 連續潮位：height(t) = mean + amp*cos(2π(t - tHigh1)/T)
function tideHeight(t, p){
  return p.mean + p.amp * Math.cos(2*Math.PI*(t - p.tHigh1)/TIDE_PERIOD);
}

function estimateTides(date, lunarDay){
  const p = tideParams(lunarDay);
  // 極值：滿潮在 tHigh1 + k*T；乾潮在 tHigh1 + T/2 + k*T
  const events = [];
  for(let k=-1;k<=2;k++){
    const th = p.tHigh1 + k*TIDE_PERIOD;
    const tl = p.tHigh1 + TIDE_PERIOD/2 + k*TIDE_PERIOD;
    if(th>=0 && th<24) events.push({t:th, type:'high', ht:p.mean+p.amp});
    if(tl>=0 && tl<24) events.push({t:tl, type:'low',  ht:p.mean-p.amp});
  }
  events.sort((a,b)=>a.t-b.t);
  return events.map(e=>({
    t: e.t,
    type: e.type,
    time: fmtHM(e.t),
    height: Math.max(0, e.ht).toFixed(1)
  }));
}

// 產生 SVG 潮汐曲線圖
function renderTideChart(lunarDay, tides){
  const p = tideParams(lunarDay);
  const W = 320, H = 130, padL = 8, padR = 8, padT = 18, padB = 22;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;

  // 潮位範圍(給點餘裕)
  const hMax = p.mean + p.amp + 0.15;
  const hMin = Math.max(0, p.mean - p.amp - 0.15);
  const xOf = t => x0 + (t/24)*(x1-x0);
  const yOf = h => y1 - ((h-hMin)/(hMax-hMin))*(y1-y0);

  // 曲線 path（每 0.2 小時取點）
  let d = '';
  for(let t=0;t<=24;t+=0.2){
    const X = xOf(t), Y = yOf(tideHeight(t,p));
    d += (t===0?'M':'L') + X.toFixed(1) + ',' + Y.toFixed(1) + ' ';
  }
  // 填色區域
  const area = d + `L${xOf(24).toFixed(1)},${y1} L${xOf(0).toFixed(1)},${y1} Z`;

  // 現在時刻
  const now = new Date();
  const nowT = now.getHours() + now.getMinutes()/60;
  const nowX = xOf(nowT), nowY = yOf(tideHeight(nowT,p));

  // 時間刻度
  let ticks = '';
  [0,6,12,18,24].forEach(hh=>{
    const X = xOf(hh);
    ticks += `<line x1="${X}" y1="${y1}" x2="${X}" y2="${y1+4}" stroke="#3a5f85" stroke-width="1"/>`;
    ticks += `<text x="${X}" y="${H-6}" fill="#9fbcd8" font-size="10" text-anchor="middle">${String(hh%24).padStart(2,'0')}</text>`;
  });

  // 滿潮/乾潮標記
  let marks = '';
  tides.forEach(ev=>{
    const X = xOf(ev.t), Y = yOf(parseFloat(ev.height));
    const isHigh = ev.type==='high';
    const col = isHigh ? '#4db8ff' : '#ffb84d';
    const icon = isHigh ? '▲' : '▼';
    const labelY = isHigh ? Y-8 : Y+16;
    marks += `<circle cx="${X}" cy="${Y}" r="3.5" fill="${col}"/>`;
    marks += `<text x="${X}" y="${labelY}" fill="${col}" font-size="11" font-weight="700" text-anchor="middle">${icon} ${ev.time}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="tideFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4db8ff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#4db8ff" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#tideFill)"/>
    <path d="${d}" fill="none" stroke="#4db8ff" stroke-width="2.5" stroke-linecap="round"/>
    ${ticks}
    <line x1="${nowX}" y1="${y0-4}" x2="${nowX}" y2="${y1}" stroke="#ff7a59" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="${nowX}" cy="${nowY}" r="4.5" fill="#ff7a59" stroke="#fff" stroke-width="1.5"/>
    <text x="${nowX}" y="${y0-7}" fill="#ff7a59" font-size="10" font-weight="700" text-anchor="middle">現在</text>
    ${marks}
  </svg>`;
}
function fmtHM(h){
  let hh=Math.floor(h)%24; let mm=Math.round((h-Math.floor(h))*60);
  if(mm===60){mm=0;hh=(hh+1)%24;}
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

// 產生日出日落太陽軌跡弧線
function renderSunArc(sunriseStr, sunsetStr){
  const W=320, H=118, padX=30, baseY=92; // baseY=地平線
  const arcTop=18;
  const toH = s => parseInt(s.slice(11,13)) + parseInt(s.slice(14,16))/60;
  const sr = toH(sunriseStr), ss = toH(sunsetStr);
  const dayLen = ss - sr;
  const x0=padX, x1=W-padX;
  const cx=(x0+x1)/2;

  // 半橢圓弧：日出(x0,baseY) → 頂點(cx,arcTop) → 日落(x1,baseY)
  const rx=(x1-x0)/2, ry=baseY-arcTop;
  const arc=`M ${x0} ${baseY} A ${rx} ${ry} 0 0 1 ${x1} ${baseY}`;

  // 現在太陽位置
  const now=new Date();
  const nowH=now.getHours()+now.getMinutes()/60;
  let frac=(nowH-sr)/dayLen;          // 0=日出 1=日落
  const isDay = frac>=0 && frac<=1;
  frac=Math.max(0,Math.min(1,frac));
  const ang=Math.PI*(1-frac);         // π→0
  const sunX=cx - rx*Math.cos(ang);
  const sunY=baseY - ry*Math.sin(ang);

  // 白天已過的弧線(高亮)
  let progArc='';
  if(isDay){
    const pa=Math.PI*(1-frac);
    const px=cx - rx*Math.cos(pa), py=baseY - ry*Math.sin(pa);
    const large=frac>0.5?0:0;
    progArc=`<path d="M ${x0} ${baseY} A ${rx} ${ry} 0 ${large} 1 ${px} ${py}" fill="none" stroke="#ffb84d" stroke-width="3" stroke-linecap="round"/>`;
  }

  const dh=Math.floor(dayLen), dm=Math.round((dayLen-dh)*60);

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <defs>
      <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${arc} L ${x1} ${baseY} Z" fill="url(#sunFill)"/>
    <path d="${arc}" fill="none" stroke="#3a5f85" stroke-width="1.5" stroke-dasharray="4 3"/>
    ${progArc}
    <line x1="10" y1="${baseY}" x2="${W-10}" y2="${baseY}" stroke="#23496f" stroke-width="1"/>
    <circle cx="${x0}" cy="${baseY}" r="3" fill="#ffb84d"/>
    <circle cx="${x1}" cy="${baseY}" r="3" fill="#ff7a59"/>
    ${isDay?`<circle cx="${sunX.toFixed(1)}" cy="${sunY.toFixed(1)}" r="8" fill="#ffd280"/>
      <circle cx="${sunX.toFixed(1)}" cy="${sunY.toFixed(1)}" r="8" fill="none" stroke="#ffb84d" stroke-width="2" opacity="0.6"/>`
      :`<circle cx="${sunX.toFixed(1)}" cy="${(baseY+8)}" r="6" fill="#4a6785"/>`}
    <text x="${x0}" y="${baseY+18}" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="middle">🌅 ${sunriseStr.slice(11,16)}</text>
    <text x="${x1}" y="${baseY+18}" fill="#ff7a59" font-size="11" font-weight="700" text-anchor="middle">🌇 ${sunsetStr.slice(11,16)}</text>
    <text x="${cx}" y="${arcTop-4}" fill="#9fbcd8" font-size="10" text-anchor="middle">日照 ${dh}時${dm}分</text>
  </svg>`;
}

/* ============================================================
   天氣代碼 -> emoji / 文字（WMO weather code）
   ============================================================ */
function wcode(c){
  const m = {
    0:['☀️','晴'],1:['🌤️','大致晴'],2:['⛅','多雲'],3:['☁️','陰'],
    45:['🌫️','霧'],48:['🌫️','霧淞'],
    51:['🌦️','毛毛雨'],53:['🌦️','小雨'],55:['🌧️','雨'],
    56:['🌧️','凍雨'],57:['🌧️','凍雨'],
    61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],
    66:['🌧️','凍雨'],67:['🌧️','凍雨'],
    71:['🌨️','小雪'],73:['🌨️','中雪'],75:['❄️','大雪'],77:['🌨️','雪珠'],
    80:['🌦️','陣雨'],81:['🌧️','陣雨'],82:['⛈️','強陣雨'],
    85:['🌨️','陣雪'],86:['❄️','陣雪'],
    95:['⛈️','雷雨'],96:['⛈️','雷雨冰雹'],99:['⛈️','強雷雨']
  };
  return m[c] || ['🌡️','—'];
}
function windDir(deg){
  const dirs=['北','東北','東','東南','南','西南','西','西北'];
  return dirs[Math.round(deg/45)%8];
}
function weekday(d){ return ['日','一','二','三','四','五','六'][d.getDay()]; }

/* ============================================================
   取得資料（Open-Meteo，免 key）
   ============================================================ */
async function fetchSpot(spot){
  const base='https://api.open-meteo.com/v1/forecast';
  const p = new URLSearchParams({
    latitude: spot.lat, longitude: spot.lon,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,precipitation',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset',
    timezone: 'Asia/Taipei',
    forecast_days: 7,
    wind_speed_unit: 'ms'
  });
  const weather = fetch(`${base}?${p}`).then(r=>r.json());

  // 海溫用 marine API
  const mp = new URLSearchParams({
    latitude: spot.lat, longitude: spot.lon,
    current: 'sea_surface_temperature',
    hourly: 'sea_surface_temperature,wave_height',
    timezone: 'Asia/Taipei', forecast_days:1
  });
  const marine = fetch(`https://marine-api.open-meteo.com/v1/marine?${mp}`)
                   .then(r=>r.json()).catch(()=>null);

  const [w, m] = await Promise.all([weather, marine]);
  return { weather:w, marine:m };
}

/* ============================================================
   渲染
   ============================================================ */
function render(spot, data){
  const w = data.weather;
  const cur = w.current;
  const daily = w.daily;
  const today = new Date();
  const lunar = solarToLunar(today);
  const phase = moonPhase(lunar.day);
  const tides = estimateTides(today, lunar.day);

  const [emo, wtxt] = wcode(cur.weather_code);
  const seaT = data.marine && data.marine.current
    ? data.marine.current.sea_surface_temperature : null;
  let waveH = null;
  if(data.marine && data.marine.hourly && data.marine.hourly.wave_height){
    const arr = data.marine.hourly.wave_height.filter(v=>v!=null);
    if(arr.length) waveH = arr[Math.min(new Date().getHours(), arr.length-1)];
  }

  let html = '';

  // 現況
  html += `<div class="card">
    <h2><span class="ic">📍</span>${spot.name}　現在天氣</h2>
    <div class="card-body">
    <div class="now">
      <div class="temp">${Math.round(cur.temperature_2m)}<small>°C</small></div>
      <div class="desc"><div class="emoji">${emo}</div><div class="txt">${wtxt}</div></div>
    </div>
    <div class="now-grid">
      <div class="metric"><div class="k">體感</div><div class="v">${Math.round(cur.apparent_temperature)}°</div></div>
      <div class="metric"><div class="k">風</div><div class="v">${windDir(cur.wind_direction_10m)} ${cur.wind_speed_10m.toFixed(0)}<small>m/s</small></div></div>
      <div class="metric"><div class="k">濕度</div><div class="v">${cur.relative_humidity_2m}<small>%</small></div></div>
      ${seaT!=null?`<div class="metric"><div class="k">海溫</div><div class="v">${seaT.toFixed(1)}°</div></div>`:''}
      ${waveH!=null?`<div class="metric"><div class="k">浪高</div><div class="v">${waveH.toFixed(1)}<small>m</small></div></div>`:''}
      <div class="metric"><div class="k">降雨</div><div class="v">${(cur.precipitation||0).toFixed(1)}<small>mm</small></div></div>
    </div>
    </div>
  </div>`;

  // 農曆 + 月相 + 潮型
  html += `<div class="card">
    <h2><span class="ic">🌙</span>農曆 · 月相</h2>
    <div class="card-body">
    <div class="lunar-row">
      <div class="moon-face">${phase.emoji}</div>
      <div class="lunar-info">
        <div class="ld">${lunar.monthName}月${lunar.dayName}</div>
        <div class="lp">${phase.name}</div>
        <div class="tide-badge ${phase.tideClass}">${phase.tide}</div>
      </div>
    </div>
    </div>
  </div>`;

  // 潮汐（曲線圖 + 時間清單）
  html += `<div class="card">
    <h2><span class="ic">🌊</span>今日潮汐（估算）</h2>
    <div class="card-body">
    <div class="tide-chart">${renderTideChart(lunar.day, tides)}</div>
    <div class="tide-list">`;
  tides.forEach(t=>{
    html += `<div class="tide-item">
      <div class="type ${t.type}">${t.type==='high'?'▲ 滿潮':'▼ 乾潮'}</div>
      <div class="tm">${t.time}</div>
      <div class="ht">${t.height} m</div>
    </div>`;
  });
  html += `</div>
    <div class="note">⚠️ 潮汐時間為依月相天文估算，僅供參考。精確滿潮/乾潮請以中央氣象署官方潮汐表為準。</div>
    </div>
  </div>`;

  // 日出日落（太陽軌跡弧線）
  html += `<div class="card">
    <h2><span class="ic">🌅</span>日出日落</h2>
    <div class="card-body">
    <div class="sun-chart">${renderSunArc(daily.sunrise[0], daily.sunset[0])}</div>
    </div>
  </div>`;

  // 未來預報（Yahoo 天氣風格：整週溫度尺度 + 範圍橫條）
  const allMax = Math.max(...daily.temperature_2m_max);
  const allMin = Math.min(...daily.temperature_2m_min);
  const span = Math.max(1, allMax - allMin);
  html += `<div class="card span2">
    <h2><span class="ic">📅</span>未來 7 天</h2>`;
  for(let i=0;i<daily.time.length;i++){
    const d = new Date(daily.time[i]+'T00:00:00');
    const ln = solarToLunar(d);
    const ph = moonPhase(ln.day);
    const [e,txt] = wcode(daily.weather_code[i]);
    const rain = daily.precipitation_probability_max[i];
    const wd = i===0 ? '今天' : '週'+weekday(d);
    const hi = Math.round(daily.temperature_2m_max[i]);
    const lo = Math.round(daily.temperature_2m_min[i]);
    // 橫條在整週尺度上的起訖(%)
    const left  = ((daily.temperature_2m_min[i]-allMin)/span)*100;
    const right = ((daily.temperature_2m_max[i]-allMin)/span)*100;
    const wet = rain!=null && rain>=20;
    html += `<div class="fc-row">
      <div class="fc-day"><div class="wd">${wd}</div><div class="dt">${d.getMonth()+1}/${d.getDate()}</div></div>
      <div class="fc-emoji">${e}</div>
      <div class="fc-moon" title="${ph.tide}">${ph.emoji}</div>
      <div class="fc-rain ${wet?'':'dry'}">${rain!=null?'💧'+rain+'%':'—'}</div>
      <div class="fc-lo">${lo}°</div>
      <div class="fc-bar"><div class="fill" style="left:${left.toFixed(0)}%;right:${(100-right).toFixed(0)}%"></div></div>
      <div class="fc-hi">${hi}°</div>
    </div>`;
  }
  html += `</div>`;

  // 未來 7 天潮汐
  html += `<div class="card span2">
    <h2><span class="ic">🌊</span>未來 7 天潮汐（估算）</h2>`;
  for(let i=0;i<daily.time.length;i++){
    const d = new Date(daily.time[i]+'T00:00:00');
    const ln = solarToLunar(d);
    const ph = moonPhase(ln.day);
    const dayTides = estimateTides(d, ln.day);
    const highs = dayTides.filter(t=>t.type==='high');
    const lows  = dayTides.filter(t=>t.type==='low');
    const wd = i===0 ? '今天' : '週'+weekday(d);
    html += `<div class="tw-row">
      <div class="tw-day">
        <div class="wd">${wd}</div>
        <div class="dt">${d.getMonth()+1}/${d.getDate()}</div>
        <span class="tw-badge ${ph.tideClass}">${ph.emoji} ${ph.tide}</span>
      </div>
      <div class="tw-times">
        <div class="tw-line"><span class="tw-t high">▲ 滿潮</span> ${highs.map(t=>t.time).join('　')}</div>
        <div class="tw-line"><span class="tw-t low">▼ 乾潮</span> ${lows.map(t=>t.time).join('　')}</div>
      </div>
    </div>`;
  }
  html += `<div class="note">⚠️ 潮汐時間為依月相天文估算，僅供參考。大潮/小潮判斷準確；精確滿潮/乾潮時刻請以中央氣象署官方潮汐表為準。</div>
  </div>`;

  return html;
}

/* ============================================================
   主流程
   ============================================================ */
function buildTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = SPOTS.map(s=>
    `<div class="tab ${s.id===currentSpot?'active':''}" data-id="${s.id}">${s.name}</div>`
  ).join('');
  el.querySelectorAll('.tab').forEach(t=>{
    t.onclick = () => { currentSpot = t.dataset.id; buildTabs(); show(); };
  });
}

async function show(){
  const spot = SPOTS.find(s=>s.id===currentSpot);
  const content = document.getElementById('content');
  if(cache[spot.id]){
    content.innerHTML = render(spot, cache[spot.id]);
    return;
  }
  content.innerHTML = `<div class="loading"><span class="spin"></span>正在取得 ${spot.name} 的資料…</div>`;
  try{
    const data = await fetchSpot(spot);
    cache[spot.id] = data;
    content.innerHTML = render(spot, data);
  }catch(err){
    content.innerHTML = `<div class="loading err">😞 載入失敗：${err.message}<br>請確認網路連線後重新整理。</div>`;
  }
}

async function loadAll(force){
  if(force) cache = {};
  // renderSeascape();  // 已改用實體背景圖
  const now = new Date();
  document.getElementById('updated').textContent =
    `更新於 ${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  buildTabs();
  await show();
}

loadAll();
</script>
